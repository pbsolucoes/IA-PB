<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!--
  6 CAPAS DE DESTAQUES do Instagram, empilhadas (cada uma 1080 × 1920).
  Não renderize com renderizar.js: use  node pecas/fatiar-grade.js  (gera pecas/png/destaque-<nome>.png).
  O Instagram recorta a capa num círculo no centro da tela: o ícone fica dentro do círculo, centrado em y = 960.
-->
<style>
:root{--w:1080px;--h:11520px}
.d{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(90% 60% at 50% 45%, #3a2d27 0%, var(--espresso) 70%)}
.anel{position:absolute;left:190px;top:610px;width:700px;height:700px;border-radius:50%;border:4px solid var(--bronze);background:rgba(171,118,70,.06)}
.anel::after{content:"";position:absolute;inset:26px;border-radius:50%;border:2px solid var(--bronze);opacity:.35}
.ico{position:absolute;left:270px;top:757px;width:540px;height:405px}
.ico svg{width:540px;height:405px;overflow:visible}
.ico svg *{fill:none;stroke:var(--bronze-claro);stroke-width:8;stroke-linecap:round;stroke-linejoin:round}
.ico svg .ch{fill:var(--bronze-claro);stroke:none}
.nome{position:absolute;left:90px;right:90px;top:1400px;text-align:center;color:var(--marfim);font-weight:300;font-size:60px;letter-spacing:12px;text-transform:uppercase;padding-left:12px}
.no{position:absolute;width:18px;height:18px;border-radius:50%;background:var(--bronze)}
</style></head><body>

<!-- ícones desenhados em SVG (viewBox 0 0 200 150), traço bronze claro -->
<section class="d" id="comece-aqui"><div class="anel"></div><div class="no" style="left:531px;top:601px"></div>
  <div class="ico"><svg viewBox="0 0 200 150"><circle class="ch" cx="38" cy="75" r="14"/><path d="M62 75 H160"/><path d="M128 45 L162 75 L128 105"/></svg></div>
  <div class="nome">Comece aqui</div></section>

<section class="d" id="diagnostico"><div class="anel"></div><div class="no" style="left:531px;top:601px"></div>
  <div class="ico"><svg viewBox="0 0 200 150"><circle cx="88" cy="62" r="44"/><path d="M120 94 L158 132"/><path d="M68 62 H108 M88 42 V82" style="stroke-width:6;opacity:.7"/></svg></div>
  <div class="nome">Diagnóstico</div></section>

<section class="d" id="ia-segura"><div class="anel"></div><div class="no" style="left:531px;top:601px"></div>
  <div class="ico"><svg viewBox="0 0 200 150"><path d="M100 4 L150 22 V68 C150 104 128 128 100 142 C72 128 50 104 50 68 V22 Z"/><path d="M76 72 L94 90 L126 56"/></svg></div>
  <div class="nome">IA segura</div></section>

<section class="d" id="saude"><div class="anel"></div><div class="no" style="left:531px;top:601px"></div>
  <div class="ico"><svg viewBox="0 0 200 150"><path d="M82 10 H118 V57 H165 V93 H118 V140 H82 V93 H35 V57 H82 Z"/></svg></div>
  <div class="nome">Saúde</div></section>

<section class="d" id="resultados"><div class="anel"></div><div class="no" style="left:531px;top:601px"></div>
  <div class="ico"><svg viewBox="0 0 200 150"><path d="M30 140 H170"/><path d="M56 140 V110 M96 140 V92 M136 140 V74"/><path d="M40 70 L92 32 L118 48 L162 10"/><path d="M138 8 H164 V34"/></svg></div>
  <div class="nome">Resultados</div></section>

<section class="d" id="sobre"><div class="anel"></div><div class="no" style="left:531px;top:601px"></div>
  <div class="ico"><svg viewBox="0 0 200 150"><circle cx="100" cy="44" r="32"/><path d="M42 144 C42 106 68 90 100 90 C132 90 158 106 158 144"/></svg></div>
  <div class="nome">Sobre</div></section>
</body></html>
