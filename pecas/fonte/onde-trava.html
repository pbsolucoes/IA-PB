<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<!--
  CAMPANHA "ONDE TRAVA?" · 4 carrosséis (1 por segmento) × 6 slides de 1080×1350.
  Não renderize com renderizar.js: use  node pecas/renderizar-onde-trava.js
  Textos: campanhas/onde-trava.md e redes/legendas-onde-trava.md. Sem preço, sem número inventado, sem nome de cliente.
  Os cartões de celular são ILUSTRAÇÃO (situações comuns), não conversas reais.
-->
<style>
:root{--w:1080px;--h:1350px}
html,body{width:1080px;height:auto;overflow:visible}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:40px}
.pad{position:absolute;left:90px;right:90px}
.pill{display:inline-flex;align-items:center;gap:14px;font-size:26px;letter-spacing:5px;text-transform:uppercase;font-weight:600;padding:14px 26px;border-radius:999px;border:2px solid var(--bronze)}
.escuro .pill{color:var(--bronze-claro)} .claro .pill{color:var(--bronze-escuro)}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--bronze);display:inline-block}
h1,h2{font-family:'Playfair Display',serif;font-weight:700;line-height:1.06;letter-spacing:-.5px}
.escuro h1 em,.escuro h2 em{color:var(--bronze-claro);font-style:italic;font-weight:600}
.claro h1 em,.claro h2 em{color:var(--bronze-escuro);font-style:italic;font-weight:600}
.desl{position:absolute;right:90px;bottom:86px;font-size:26px;letter-spacing:5px;text-transform:uppercase;color:var(--bronze-claro);font-weight:600}
.num{position:absolute;right:90px;bottom:86px;font-size:26px;letter-spacing:4px;font-weight:600}
.escuro .num{color:var(--bronze-claro)} .claro .num{color:var(--bronze-escuro)}
/* capa */
.palco{position:absolute;left:90px;right:90px;top:640px;height:520px;border-radius:36px;background:linear-gradient(160deg,#3b2e27,#2f2520);border:2px solid rgba(195,136,91,.35);overflow:hidden}
.palco svg.cena{position:absolute;left:40px;bottom:30px;width:420px;height:420px}
.palco svg.cena *{fill:none;stroke:#C3885B;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.cel{position:absolute;right:46px;top:48px;width:400px;height:430px;border-radius:40px;background:#FDF9F5;box-shadow:0 30px 60px rgba(0,0,0,.45);padding:26px 22px;display:flex;flex-direction:column;gap:16px;color:#2A211D}
.cel .topo{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;border-bottom:2px solid #efe4d8;padding-bottom:14px}
.cel .topo span{width:40px;height:40px;border-radius:50%;background:#e9d9c8;display:inline-block}
.bal{font-size:24px;line-height:1.3;padding:14px 18px;border-radius:20px;max-width:88%}
.bal.ele{background:#f1e7dc;border-bottom-left-radius:6px}
.bal.nos{background:#AB7646;color:#2A211D;align-self:flex-end;border-bottom-right-radius:6px}
.alerta{margin-top:auto;font-size:21px;font-weight:600;color:#9a3b2a;background:#fbebe7;border-radius:14px;padding:12px 16px;display:flex;gap:10px;align-items:center}
.alerta:before{content:"";width:12px;height:12px;border-radius:50%;background:#d0533b;flex:none}
/* sinais */
.big{position:absolute;right:80px;top:40px;font-family:'Playfair Display',serif;font-weight:700;font-size:300px;line-height:1;color:transparent;-webkit-text-stroke:3px rgba(171,118,70,.45)}
.ic{width:150px;height:150px;border-radius:50%;background:#f3e7da;display:flex;align-items:center;justify-content:center}
.ic svg{width:90px;height:90px}.ic svg *{fill:none;stroke:#936431;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.sinal h2{font-size:84px;margin-top:46px;color:var(--espresso)}
.sinal p.t{font-size:44px;line-height:1.4;margin-top:40px;color:#4a3b33}
.nota{position:absolute;left:90px;right:90px;top:1110px;font-size:28px;color:#7a6658;border-left:4px solid var(--bronze);padding-left:22px}
/* método */
.passo{display:flex;gap:34px;align-items:flex-start;margin-top:44px}
.passo b{position:relative;background:#2e2420;flex:none;width:96px;height:96px;border-radius:50%;border:3px solid var(--bronze-claro);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:50px;color:var(--bronze-claro)}
.passo h3{font-family:'Playfair Display',serif;font-size:52px;font-weight:700;line-height:1.1}
.passo p{font-size:34px;line-height:1.35;margin-top:8px;color:#e4d6c9}
.trilho{position:absolute;left:137px;width:3px;background:rgba(195,136,91,.45)}
/* cta */
.cta-box{position:absolute;left:90px;right:90px;top:690px;border:2px solid rgba(195,136,91,.5);border-radius:32px;padding:44px 46px;background:rgba(255,255,255,.03)}
.cta-box .l{display:flex;gap:18px;align-items:center;font-size:38px;margin-top:18px}
.cta-box .l:first-child{margin-top:0}
.cta-box .l i{width:16px;height:16px;border-radius:50%;background:var(--bronze);flex:none}
.botao{position:absolute;left:90px;top:1020px;background:var(--bronze);color:var(--espresso);font-weight:700;font-size:38px;padding:26px 44px;border-radius:999px}
</style></head><body class="escuro" style="background:#111">
<div id="raiz"></div>
<script>
const SEG = {
  servicos:{nome:'Serviços profissionais', h:'Seu escritório cresce. E tudo <em>ainda passa por você?</em>',
    chat:{quem:'Cliente', msgs:[['ele','Bom dia! O documento sai hoje? O prazo é amanhã.'],['ele','Alguém pode me retornar?']], alerta:'Prazo vencendo · sem responsável'},
    cena:'<rect x="70" y="120" width="220" height="270" rx="14"/><path d="M110 180h140M110 230h140M110 280h90"/><rect x="40" y="90" width="220" height="270" rx="14" opacity=".55"/><circle cx="320" cy="140" r="70"/><path d="M320 100v42l28 18"/>',
    s:[['Sinal 1','O cliente cobra <em>antes de você avisar.</em>','Prazos e retornos dependem de alguém lembrar. Quando ninguém lembra, quem cobra é o cliente.','<circle cx="45" cy="45" r="32"/><path d="M45 25v22l14 9"/>'],
       ['Sinal 2','Toda decisão <em>espera o sócio.</em>','Se a equipe não sabe o que pode decidir sozinha, a fila para na sua mesa.','<rect x="14" y="40" width="62" height="36" rx="6"/><path d="M30 40V26a15 15 0 0 1 30 0v14"/>'],
       ['Sinal 3','A proposta demora <em>mais que o serviço.</em>','Cada orçamento começa do zero. O cliente esfria enquanto o documento é montado.','<path d="M24 12h32l16 16v50H24z"/><path d="M56 12v16h16M36 50h28M36 64h20"/>']]},
  varejo:{nome:'Comércio e varejo', h:'Sua loja vende. <em>Mas onde ela trava?</em>',
    chat:{quem:'Cliente', msgs:[['ele','Oi! Ainda tem no tamanho M?'],['ele','Qual o valor?']], alerta:'Sem resposta há 2 dias'},
    cena:'<path d="M40 170h340l-24-80H64z"/><path d="M60 170v210h300V170"/><path d="M160 380V270h100v110"/><path d="M40 170c0 28 42 28 42 0c0 28 42 28 42 0c0 28 42 28 42 0c0 28 42 28 42 0c0 28 42 28 42 0c0 28 42 28 42 0c0 28 42 28 42 0c0 28 42 28 42 0"/>',
    s:[['Sinal 1','Mensagem sem resposta <em>é venda perdida.</em>','WhatsApp e Direct lotados, e o cliente que perguntou o preço comprou em outro lugar.','<path d="M14 20h62v40H40l-16 14V60H14z"/>'],
       ['Sinal 2','Você não sabe <em>quanto sobrou no mês.</em>','Estoque e caixa na cabeça ou no caderno não mostram por onde o dinheiro escapa.','<path d="M14 76h62M24 76V50M42 76V30M60 76V42"/>'],
       ['Sinal 3','Quem comprou uma vez <em>não voltou.</em>','Ninguém acompanha o cliente depois da venda. Ele esquece a loja.','<path d="M22 34h46l-6 42H28z"/><path d="M34 34a11 11 0 0 1 22 0"/>']]},
  educacao:{nome:'Educação e cursos', h:'Sua escola ensina bem. <em>E a gestão acompanha?</em>',
    chat:{quem:'Interessado', msgs:[['ele','Como faço a matrícula?'],['ele','Ainda tem vaga para a turma da noite?']], alerta:'Matrícula esperando resposta'},
    cena:'<path d="M40 150l170-70 170 70-170 70z"/><path d="M110 180v90c0 30 200 30 200 0v-90"/><path d="M380 150v110"/><circle cx="380" cy="275" r="14"/>',
    s:[['Sinal 1','A matrícula depende <em>de alguém responder.</em>','Dúvidas repetidas no WhatsApp tomam o dia da equipe, e o interessado desiste no meio.','<path d="M14 20h62v40H40l-16 14V60H14z"/>'],
       ['Sinal 2','O aluno desiste <em>e ninguém percebe.</em>','Faltas e atrasos são sinais. Sem acompanhamento, eles viram cancelamento.','<circle cx="45" cy="30" r="14"/><path d="M18 78c4-18 14-26 27-26s23 8 27 26"/>'],
       ['Sinal 3','Cobrança feita <em>na mão, todo mês.</em>','Lembretes e conferências manuais consomem horas que poderiam ir para os alunos.','<rect x="12" y="24" width="66" height="44" rx="8"/><path d="M12 38h66M24 56h16"/>']]},
  beleza:{nome:'Beleza, bem-estar e estética', h:'Sua agenda está cheia. <em>E os buracos nela?</em>',
    chat:{quem:'Agenda de hoje', msgs:[['ele','14h · Corte e escova'],['ele','15h30 · Horário vago']], alerta:'Cliente faltou sem avisar'},
    cena:'<rect x="60" y="90" width="300" height="290" rx="20"/><path d="M60 160h300M130 60v60M290 60v60"/><path d="M110 220h40M190 220h40M270 220h40M110 290h40M190 290h40"/><circle cx="290" cy="290" r="22"/>',
    s:[['Sinal 1','Cliente que falta <em>sem avisar.</em>','Sem confirmação, o horário vago só aparece quando já não dá para encaixar ninguém.','<rect x="14" y="20" width="62" height="56" rx="8"/><path d="M14 38h62M32 12v14M58 12v14M36 52l18 14M54 52L36 66"/>'],
       ['Sinal 2','Agendar toma o tempo <em>de quem atende.</em>','Responder mensagem entre um atendimento e outro atrasa os dois.','<circle cx="45" cy="45" r="32"/><path d="M45 25v22l14 9"/>'],
       ['Sinal 3','Ela gostou, <em>mas não voltou.</em>','Sem lembrete de retorno, a próxima visita fica para quando a cliente lembrar.','<path d="M45 76S14 56 14 34a16 16 0 0 1 31-6 16 16 0 0 1 31 6c0 22-31 42-31 42z"/>']]}
};
const MARCA='<div class="marca"><span class="pb">PB</span><span class="sol">Soluções IA</span></div>';
let html='';
for(const [k,d] of Object.entries(SEG)){
  html+=`<section class="s escuro" id="${k}-01"><div class="pad" style="top:150px"><span class="pill"><i></i>${d.nome}</span>
    <h1 style="font-size:96px;margin-top:44px">${d.h}</h1></div>
    <div class="palco"><svg class="cena" viewBox="0 0 420 420">${d.cena}</svg>
      <div class="cel"><div class="topo"><span></span>${d.chat.quem}</div>${d.chat.msgs.map(m=>`<div class="bal ${m[0]}">${m[1]}</div>`).join('')}<div class="alerta">${d.chat.alerta}</div></div></div>
    ${MARCA}<div class="desl">Deslize →</div></section>`;
  d.s.forEach((x,i)=>{
    html+=`<section class="s claro sinal" id="${k}-0${i+2}"><div class="big">${i+1}</div><div class="pad" style="top:170px"><div class="ic"><svg viewBox="0 0 90 90">${x[3]}</svg></div>
      <div class="eyebrow" style="margin-top:46px">${x[0]} · ${d.nome}</div><h2>${x[1]}</h2><div class="linha" style="margin-top:44px"></div><p class="t">${x[2]}</p></div>
      <p class="nota">Sinal comum em muitos negócios. Cada empresa é um caso: por isso começamos pelo diagnóstico.</p>${MARCA}<div class="num">${i+2}/6</div></section>`;
  });
  html+=`<section class="s escuro" id="${k}-05"><div class="pad" style="top:150px"><div class="eyebrow">Por onde começar?</div>
    <h2 style="font-size:92px;margin-top:26px">Pela gestão. <em>A IA vem depois.</em></h2>
    <div style="position:relative;margin-top:30px"><div class="trilho" style="left:47px;top:48px;height:310px"></div>
    <div class="passo"><b>1</b><div><h3>Diagnóstico da gestão</h3><p>Onde o negócio perde tempo e dinheiro.</p></div></div>
    <div class="passo"><b>2</b><div><h3>Desenho do processo</h3><p>Quem faz, quando faz e o que vira regra.</p></div></div>
    <div class="passo"><b>3</b><div><h3>Agentes de IA</h3><p>Só então a tecnologia entra para trabalhar.</p></div></div></div></div>
    ${MARCA}<div class="num">5/6</div></section>`;
  html+=`<section class="s escuro" id="${k}-06"><div class="pad" style="top:170px"><span class="pill"><i></i>${d.nome}</span>
    <h2 style="font-size:100px;margin-top:44px">Descubra onde o seu negócio <em>trava.</em></h2></div>
    <div class="cta-box"><div class="l"><i></i>Diagnóstico da gestão gratuito</div><div class="l"><i></i>30 a 40 minutos</div><div class="l"><i></i>Por Google Meet</div></div>
    <div class="botao">Fale comigo no WhatsApp · link na bio</div>${MARCA}<div class="num">6/6</div></section>`;
}
document.getElementById('raiz').innerHTML=html;
</script></body></html>
